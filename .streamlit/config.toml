# Tema do Streamlit — DePIN Urbano
#
# Definir o tema aqui (e não só por CSS) faz com que os próprios componentes
# do Streamlit — menus, calendários, o seletor de arquivos — nasçam já com as
# cores certas. Só CSS não alcança essas partes.
#
# Bloco 6 (27/09): paleta da página da gincana do Rafa (depinurbano.vercel.app),
# para as duas páginas parecerem um produto só. Detalhes e o resto da paleta
# em tema_visual.py.
#   fundo    #FFF9EF  creme
#   campos   #F4F0E7  creme um pouco mais escuro
#   destaque #E03A12  vermelho-laranja (botões, seleção)
#   texto    #42302E  marrom escuro
#
# O tema anterior (azul pastel da Fase 3) está no histórico do Git.

[theme]
base = "light"
primaryColor = "#E03A12"
backgroundColor = "#FFF9EF"
secondaryBackgroundColor = "#F4F0E7"
textColor = "#42302E"
font = "sans serif"

[client]
toolbarMode = "minimal"
